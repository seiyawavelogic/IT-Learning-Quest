name: CI

on:
    push:
        branches:
        - main
        - 'feature/**'
    pull_request:
        branches:
        - main

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
        - run: npm ci
        - run: npx prisma generate
        - run: npm run lint

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
        - run: npm ci
        - run: npx prisma generate
        - run: npm test

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint, test]
        steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
        - run: npm ci
        - run: npx prisma generate
        - run: npm run build
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/itlearningquest

